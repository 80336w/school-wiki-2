name: 更新新闻

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node build.js

      - name: 提交变化
        run: |
          git config user.name news-bot
          git config user.email bot@users.noreply.github.com
          git add data/
          git diff --quiet --cached || git commit -m "chore: 更新新闻"
          git push
